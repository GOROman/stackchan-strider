<title>Stackchan Strider</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* レイアウト: 作業台の上の実機を主役にした1画面。左に3Dステージ、右に計器盤(操作・検証・部品)。狭い幅では縦積み。 */
:root {
  --bench: #e9ecef;        /* 作業台(ページ地) */
  --panel: #f7f8f9;        /* 計器盤 */
  --ink: #1d232c;          /* 文字 */
  --ink-soft: #5b6573;     /* 補助文字 */
  --line: #cfd5dc;         /* 罫線 */
  --chassis: #2d3340;      /* 機体のチャコール */
  --signal: #cf2e25;       /* 機体の赤(強調) */
  --signal-ink: #ffffff;
  --gear: #c79200;         /* 歯車の黄 */
  --ok: #1f8a55;
  --ng: #c5372c;
  --stage-top: #f4f6f8;
  --stage-bottom: #dfe4e9;
  --grid: #b9c1cb;
  --font-display: "Chakra Petch", "Noto Sans JP", system-ui, sans-serif;
  --font-body: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bench: #12151a; --panel: #1a1e25; --ink: #e6e9ee; --ink-soft: #98a2b1; --line: #2e3540;
    --chassis: #aab3c2; --signal: #ff6257; --signal-ink: #1f0705; --gear: #f2c230; --ok: #4cc38a; --ng: #ff7a6b;
    --stage-top: #1d222a; --stage-bottom: #12151a; --grid: #3a4250; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bench: #12151a; --panel: #1a1e25; --ink: #e6e9ee; --ink-soft: #98a2b1; --line: #2e3540;
  --chassis: #aab3c2; --signal: #ff6257; --signal-ink: #1f0705; --gear: #f2c230; --ok: #4cc38a; --ng: #ff7a6b;
  --stage-top: #1d222a; --stage-bottom: #12151a; --grid: #3a4250; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bench); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box;
}
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 12px; min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  background: linear-gradient(var(--stage-top), var(--stage-bottom)); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.brand { position: absolute; left: 14px; top: 12px; pointer-events: none; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.04em; line-height: 1.1; text-transform: uppercase; }
.brand h1 b { color: var(--signal); font-weight: 700; }
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--ink-soft); }
.readout { position: absolute; left: 14px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-family: var(--font-data);
  font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; pointer-events: none; }
.readout b { color: var(--ink); font-weight: 500; }
.hint { position: absolute; right: 12px; bottom: 12px; font-size: 11px; color: var(--ink-soft); pointer-events: none; }
.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ng); }

.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; padding: 10px 6px; border: 0; background: none; color: var(--ink-soft); font: 500 13px var(--font-body); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--signal); }
.tabs button:focus-visible, .btn:focus-visible, .row-btn:focus-visible, input:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }
.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
h2 { margin: 0; font: 600 12px var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.group { display: flex; flex-direction: column; gap: 8px; }
.transport { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--bench); color: var(--ink); border-radius: 6px; padding: 8px 12px; font: 500 13px var(--font-body); cursor: pointer; }
.btn.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); flex: 1; font-weight: 700; }
.btn[aria-pressed="true"] { border-color: var(--signal); color: var(--signal); }
.slider { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) 5em; align-items: center; gap: 8px; font-size: 13px; }
.slider output { font-family: var(--font-data); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--signal); }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.segment { display: flex; gap: 6px; }
.segment .btn { flex: 1; }
.segment .btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.checks label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.checks input { accent-color: var(--signal); }
.note { margin: 0; font-size: 12px; color: var(--ink-soft); }
.note strong { color: var(--ink); font-weight: 500; }
.spec { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 12.5px; }
.spec dt { color: var(--ink-soft); }
.spec dd { margin: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; }
.verdict { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bench); }
.verdict strong { font: 700 15px var(--font-display); letter-spacing: 0.04em; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font: 500 11px var(--font-data); color: #fff; background: var(--ok); white-space: nowrap; }
.pill.ng { background: var(--ng); }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.check:first-of-type { border-top: 0; }
.check .what { font-weight: 500; }
.check .how { grid-column: 2; color: var(--ink-soft); font-size: 12px; overflow-wrap: anywhere; }
.check .how code { font-family: var(--font-data); font-size: 11.5px; color: var(--ink); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; font-weight: 500; color: var(--ink-soft); padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 0; border-bottom: 1px solid var(--line); }
td.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; padding: 4px 6px; white-space: nowrap; }
.row-btn { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 6px; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.row-btn[aria-pressed="true"] { color: var(--signal); font-weight: 700; }
.swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.colors { display: flex; flex-direction: column; gap: 6px; }
.color { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; cursor: pointer; }
.color input[type="color"] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
.color span { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.color b { font-weight: 500; font-size: 13px; }
.color small { font-size: 11px; color: var(--ink-soft); }
.color code { font-family: var(--font-data); font-size: 12px; color: var(--ink-soft); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bench); color: var(--ink); font: 12px var(--font-body); cursor: pointer; }
.preset:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }
.preset[aria-pressed="true"] { border-color: var(--signal); }
.preset i { display: flex; width: 30px; height: 18px; border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.preset i u { flex: 1; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(260px, 52%) minmax(0, 1fr); }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="app">
  <section class="stage" aria-label="3D プレビュー">
    <canvas id="view"></canvas>
    <div class="brand">
      <h1>Stackchan <b>Strider</b></h1>
      <p>首振りサーボ1個で歩く、ヤンセン機構の4脚ベース</p>
    </div>
    <div class="readout" id="readout"></div>
    <div class="hint">ドラッグ: 回転 / ホイール・ピンチ: 拡大 / 右ドラッグ: 移動</div>
    <div class="fail" id="fail" hidden>3D 表示を開始できませんでした。WebGL が使えるブラウザで開いてください。</div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-drive" aria-selected="true" aria-controls="pane-drive">操作</button>
      <button role="tab" id="tab-verify" aria-selected="false" aria-controls="pane-verify">検証</button>
      <button role="tab" id="tab-parts" aria-selected="false" aria-controls="pane-parts">部品</button>
    </div>

    <div class="pane" id="pane-drive" role="tabpanel" aria-labelledby="tab-drive">
      <div class="group">
        <h2>歩行</h2>
        <div class="transport">
          <button class="btn primary" id="play">停止</button>
          <button class="btn" id="reverse" aria-pressed="false">後退</button>
        </div>
        <label class="slider" for="rpm"><span>回転数</span><input type="range" id="rpm" min="2" max="80" step="1" value="24"><output id="rpm-out"></output></label>
        <label class="slider" for="crank"><span>クランク角</span><input type="range" id="crank" min="0" max="359" step="1" value="0"><output id="crank-out"></output></label>
      </div>
      <div class="group">
        <h2>表示</h2>
        <div class="segment" role="group" aria-label="見た目">
          <button class="btn" id="look-plain" aria-pressed="true">図面風</button>
          <button class="btn" id="look-real" aria-pressed="false">実写風</button>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="show-sc" checked>スタックチャン</label>
          <label><input type="checkbox" id="show-legs" checked>脚</label>
          <label><input type="checkbox" id="show-sway" checked>接地姿勢の揺れ</label>
          <label><input type="checkbox" id="show-path" checked>足先の軌跡</label>
        </div>
        <label class="slider" for="explode"><span>分解</span><input type="range" id="explode" min="0" max="100" step="1" value="0"><output id="explode-out"></output></label>
      </div>
      <div class="group">
        <h2>色</h2>
        <div class="colors">
          <label class="color" for="color-chassis"><input type="color" id="color-chassis"><span><b>骨格</b><small>側板・デッキ・ソケット枠</small></span><code id="color-chassis-out"></code></label>
          <label class="color" for="color-accent"><input type="color" id="color-accent"><span><b>主役</b><small>ヨーク・三角板・歯車・クランク</small></span><code id="color-accent-out"></code></label>
          <label class="color" for="color-link"><input type="color" id="color-link"><span><b>つなぎ</b><small>リンク・シャフト・スリーブ</small></span><code id="color-link-out"></code></label>
        </div>
        <div class="presets" id="presets" role="group" aria-label="配色の例"></div>
        <div class="transport">
          <button class="btn" id="color-copy">色コードをコピー</button>
          <button class="btn" id="color-reset">元に戻す</button>
        </div>
        <p class="note" id="color-note">選んだ色はこのブラウザに残ります。設計ファイルは変わりません。</p>
      </div>
      <div class="group">
        <h2>しくみ</h2>
        <p class="note">スタックチャンの<strong>土台</strong>を枠にはめ、<strong>頭</strong>を左右のイヤーパッドで挟みます。首振りサーボを連続回転させると、頭は回れないので土台とターンテーブル歯車が回り、45° の傘歯車で横向きのクランク軸に伝わって4本の脚が動きます。頭は上下にはうなずけます。</p>
        <dl class="spec" id="spec"></dl>
      </div>
    </div>

    <div class="pane" id="pane-verify" role="tabpanel" aria-labelledby="tab-verify" hidden></div>
    <div class="pane" id="pane-parts" role="tabpanel" aria-labelledby="tab-parts" hidden></div>
  </aside>
</div>

<script type="application/json" id="walker-data">/*__DATA__*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("walker-data").textContent);
  const F = DATA.frames;
  const $ = (id) => document.getElementById(id);
  const bytes = (text) => { const raw = atob(text); const out = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i); return out.buffer; };
  const f32 = (text) => new Float32Array(bytes(text));
  const u32 = (text) => new Uint32Array(bytes(text));
  const fmt = (value, digits) => Number(value).toFixed(digits === undefined ? 1 : digits);
  const el = (tag, attrs, children) => {
    const node = document.createElement(tag);
    for (const key in (attrs || {})) { if (key === "text") node.textContent = attrs[key]; else node.setAttribute(key, attrs[key]); }
    (children || []).forEach((child) => node.appendChild(typeof child === "string" ? document.createTextNode(child) : child));
    return node;
  };

  // ---------------------------------------------------------------- 状態
  const state = {
    playing: !window.matchMedia("(prefers-reduced-motion: reduce)").matches,
    direction: 1, rpm: 24, frame: 0, lap: 0, explode: 0, sway: true, highlight: null, real: false,
  };

  // ---------------------------------------------------------------- 計器盤(検証・部品・諸元)
  function pill(ok) { return el("span", { class: ok ? "pill" : "pill ng", text: ok ? "合格" : "不合格" }); }
  function check(ok, what, how) {
    const howNode = el("div", { class: "how" });
    howNode.innerHTML = how;
    return el("div", { class: "check" }, [pill(ok), el("div", { class: "what", text: what }), howNode]);
  }
  function buildVerify() {
    const pane = $("pane-verify"), w = DATA.walk, g = DATA.gears, gait = w.gait;
    const sim = DATA.sim;
    const all = w.ok && g.ok && DATA.bom.ok && (!sim || sim.falls === 0);
    pane.appendChild(el("div", { class: "verdict" }, [pill(all), el("strong", { text: all ? "全検証に合格" : "不合格の項目あり" })]));
    if (sim) {
      const phys = el("div", { class: "group" }, [el("h2", { text: "物理シミュレーション(MuJoCo)" })]);
      const typical = sim.rows.filter((r) => r.friction === 0.5 && r.command === 0.6)[0];
      phys.appendChild(check(sim.falls === 0, "床の摩擦 0.3〜1.0 × 速度3段階 × 前進・後退で歩ける",
        "<code>" + sim.cases + " 条件</code>中、転倒 <code>" + sim.falls + "</code>。前後の傾き最大 <code>" + fmt(sim.worst_pitch_deg) + "°</code>"));
      if (typical) phys.appendChild(check(!typical.fallen, "標準条件(摩擦 0.5、クランク約 " + fmt(typical.crank_rpm, 0) + " rpm)",
        "速度 <code>" + fmt(typical.speed_mm_s) + " mm/s</code>、<code>" + fmt(typical.advance_per_rev_mm) + " mm/回転</code>、サーボ平均 <code>" + fmt(typical.servo_torque_mNm_mean) + " mN·m</code>"));
      sim.sensitivity.forEach((row) => phys.appendChild(check(row.falls === 0, "条件を悪くした場合: " + row.label,
        row.cases + " 条件中、転倒 <code>" + row.falls + "</code>。前後の傾き最大 " + fmt(row.pitch) + "°、サーボ平均の最大 " + fmt(row.torque) + " mN·m")));
      phys.appendChild(el("p", { class: "note", text: "閉リンクの4脚、歯車の拘束、サーボのトルク-速度特性、関節の摩擦を入れた剛体シミュレーションです。部品のたわみ、歯車のバックラッシュ、頭とイヤーパッドのすきまは入っていません。" }));
      pane.appendChild(phys);
    }
    const gearGroup = el("div", { class: "group" }, [el("h2", { text: "歯車の噛み合い" })]);
    g.specs.forEach((row) => gearGroup.appendChild(check(row.ok, row.item, row.value)));
    g.cases.forEach((row) => gearGroup.appendChild(check(row.ok, row.case,
      "干渉 <code>" + fmt(row.max_overlap_mm3, 4) + " mm³</code>、バックラッシュ <code>" + fmt(row.backlash_min_mm, 2) + "〜" + fmt(row.backlash_max_mm, 2) + " mm</code>(半ピッチ " + fmt(row.half_pitch_mm, 2) + " mm)")));
    pane.appendChild(gearGroup);
    const walk = el("div", { class: "group" }, [el("h2", { text: "歩行1周の干渉" })]);
    walk.appendChild(check(w.self_test.ok, "干渉検出の自己診断", "部品をわざとずらして検出できることを確認"));
    walk.appendChild(check(w.collisions.ok, "全部品の干渉(スタックチャン込み)", "クランク1回転を <code>" + w.collisions.poses + " 姿勢</code>で調べ、重なり <code>" + w.collisions.hits.length + " 件</code>"));
    walk.appendChild(check(w.gaps.ok, "連結していない部品の最小すきま", "<code>" + fmt(w.gaps.min_gap_mm, 2) + " mm</code>(要求 " + w.gaps.required_mm + " mm)"));
    const asm = DATA.assembly;
    if (asm) walk.appendChild(check(asm.ops.every((op) => op.ok), "組立手順どおりに部品を差し込める", "左右の脚 <code>" + asm.ops.length + " 操作</code>(重ねる・クリップをはめる)を 1 つずつ動かし、重なり <code>" + asm.ops.filter((op) => !op.ok).length + " 件</code>"));
    walk.appendChild(check(w.keys.ok, "抜け止め: すべての突起を C クリップで留める", "クリップの掛かり <code>" + fmt(w.keys.clip_overlap_mm, 1) + " mm</code>、穴と軸のすきま 片側 <code>" + fmt(w.keys.radial_fit_mm, 2) + " mm</code>、軸方向の遊びは最大 <code>" + fmt(w.keys.max_axial_play_mm, 1) + " mm</code>"));
    walk.appendChild(check(w.head_lock.ok, "頭の回り止め", "ヨーの遊び <code>±" + fmt(w.head_lock.yaw_play_deg[0], 1) + "°</code>、うなずき <code>" + w.head_lock.nod_free_range_deg.join("〜") + "°</code> で干渉なし"));
    walk.appendChild(check(w.table_retention.ok, "ターンテーブルの浮き上がり止め", "0.3 mm は自由、1.0 mm でカラーに当たる"));
    pane.appendChild(walk);
    const rest = el("div", { class: "group" }, [el("h2", { text: "接地姿勢とトルク" })]);
    rest.appendChild(check(gait.ok, "転倒せずに歩ける", "傾き最大 <code>" + fmt(gait.tilt_max_deg) + "°</code>(前後 " + fmt(gait.pitch_deg[0]) + "〜+" + fmt(gait.pitch_deg[1]) + "°、左右 ±" + fmt(gait.roll_deg[1]) + "°)、静的転倒角 " + fmt(gait.static_tip_angle_deg, 0) + "°、支持脚は常に " + gait.min_support_feet + " 本以上"));
    rest.appendChild(check(gait.torque_peak_Nm <= gait.servo_rated_Nm, "サーボのトルク", "持ち上げ分のピーク <code>" + fmt(gait.torque_peak_Nm * 1000) + " mN·m</code> / 定格 " + fmt(gait.servo_rated_Nm * 1000, 0) + " mN·m(摩擦は含まない)"));
    rest.appendChild(el("p", { class: "note", text: "静的なつり合いの計算です。4脚では足が2本同時に浮く瞬間があり、機体は3本足で支えられて前後に小さく揺れながら歩きます。" }));
    const assume = el("p", { class: "note" });
    assume.textContent = "前提: " + gait.assumptions.join(" / ");
    rest.appendChild(assume);
    pane.appendChild(rest);
  }
  function buildParts() {
    const pane = $("pane-parts"), bom = DATA.bom;
    pane.appendChild(el("div", { class: "group" }, [
      el("h2", { text: "印刷部品" }),
      el("p", { class: "note", text: "印刷 " + bom.total_printed_parts + " 個(STL " + bom.unique_stl + " 種)、購入部品 " + bom.purchased_parts + " 個。ネジ・ベアリングなし。全部品サポートなしで造形できる向きで出力しています。行を押すとその部品だけ強調します。" }),
    ]));

  // 角は立てたまま曲面だけ滑らかにした形状(隣の面との角度が約 40° 未満なら法線をならす)
  const smoothCache = {};
  function smoothGeometry(key) {
    if (smoothCache[key]) return smoothCache[key];
    const flat = geometries[key].toNonIndexed();
    const pos = flat.attributes.position.array, faces = pos.length / 9;
    const faceNormal = new Float32Array(faces * 3), faceArea = new Float32Array(faces);
    const keys = new Array(faces * 3), corners = new Map();
    for (let f = 0; f < faces; f++) {
      const o = f * 9;
      const ax = pos[o + 3] - pos[o], ay = pos[o + 4] - pos[o + 1], az = pos[o + 5] - pos[o + 2];
      const bx = pos[o + 6] - pos[o], by = pos[o + 7] - pos[o + 1], bz = pos[o + 8] - pos[o + 2];
      const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
      const length = Math.hypot(nx, ny, nz) || 1;
      faceArea[f] = length; faceNormal[f * 3] = nx / length; faceNormal[f * 3 + 1] = ny / length; faceNormal[f * 3 + 2] = nz / length;
      for (let c = 0; c < 3; c++) {
        const p = o + c * 3;
        const key3 = Math.round(pos[p] * 200) + "_" + Math.round(pos[p + 1] * 200) + "_" + Math.round(pos[p + 2] * 200);
        keys[f * 3 + c] = key3;
        const list = corners.get(key3);
        if (list) list.push(f); else corners.set(key3, [f]);
      }
    }
    const normals = new Float32Array(pos.length), CREASE = 0.76;
    for (let f = 0; f < faces; f++) {
      const fx = faceNormal[f * 3], fy = faceNormal[f * 3 + 1], fz = faceNormal[f * 3 + 2];
      for (let c = 0; c < 3; c++) {
        let nx = 0, ny = 0, nz = 0;
        const list = corners.get(keys[f * 3 + c]);
        for (let i = 0; i < list.length; i++) {
          const g = list[i], gx = faceNormal[g * 3], gy = faceNormal[g * 3 + 1], gz = faceNormal[g * 3 + 2];
          if (fx * gx + fy * gy + fz * gz > CREASE) { nx += gx * faceArea[g]; ny += gy * faceArea[g]; nz += gz * faceArea[g]; }
        }
        const length = Math.hypot(nx, ny, nz) || 1, p = f * 9 + c * 3;
        normals[p] = nx / length; normals[p + 1] = ny / length; normals[p + 2] = nz / length;
      }
    }
    flat.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
    smoothCache[key] = flat;
    return flat;
  }

  // レンズのボケ: いったん画像と奥行きを別の面に描き、ピント位置から離れた画素ほど広くぼかして画面へ出す
  const rim = new THREE.DirectionalLight(0xffffff, 0);
  rim.position.set(-220, 170, -260);
  scene.add(rim);
  let target = null, targetScale = 1;
  const postScene = new THREE.Scene(), postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const postMaterial = new THREE.ShaderMaterial({
    uniforms: { tColor: { value: null }, tDepth: { value: null }, uNear: { value: camera.near }, uFar: { value: camera.far },
      uFocus: { value: 500 }, uTexel: { value: new THREE.Vector2(1, 1) }, uMaxBlur: { value: 8 }, uStrength: { value: 2.4 } },
    vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
    fragmentShader: [
      "precision highp float;",
      "uniform sampler2D tColor; uniform sampler2D tDepth;",
      "uniform float uNear; uniform float uFar; uniform float uFocus; uniform float uMaxBlur; uniform float uStrength;",
      "uniform vec2 uTexel; varying vec2 vUv;",
      "float distanceAt(vec2 uv) { float z = texture2D(tDepth, uv).x * 2.0 - 1.0; return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear)); }",
      "float blurAt(float d) { return clamp(abs(d - uFocus) / uFocus * uStrength, 0.0, 1.0); }",
      "void main() {",
      "  float own = blurAt(distanceAt(vUv));",
      "  vec4 sum = texture2D(tColor, vUv); float total = 1.0;",
      "  for (int i = 1; i <= 36; i++) {",
      "    float fi = float(i); float r = sqrt(fi / 36.0);",
      "    vec2 uv = vUv + vec2(cos(fi * 2.39996323), sin(fi * 2.39996323)) * r * own * uMaxBlur * uTexel;",
      "    float other = blurAt(distanceAt(uv));",
      "    float w = mix(0.04, 1.0, clamp(other / max(own, 0.001), 0.0, 1.0));",  // ピントの合った部分がボケた部分へにじむのを抑える
      "    sum += texture2D(tColor, uv) * w; total += w;",
      "  }",
      "  gl_FragColor = sum / total;",
      "}",
    ].join("\n"),
    depthTest: false, depthWrite: false, blending: THREE.NoBlending,
  });
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial));
  function resizeTarget(width, height) {
    if (!state.real) return;
    targetScale = Math.min(2, Math.max(1.5, window.devicePixelRatio || 1));
    const w = Math.max(2, Math.round(width * targetScale)), h = Math.max(2, Math.round(height * targetScale));
    if (target && target.width === w && target.height === h) return;
    if (target) { target.depthTexture.dispose(); target.dispose(); }
    target = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat });
    target.texture.encoding = THREE.sRGBEncoding;
    target.depthTexture = new THREE.DepthTexture(w, h, THREE.UnsignedIntType);
    postMaterial.uniforms.tColor.value = target.texture;
    postMaterial.uniforms.tDepth.value = target.depthTexture;
    postMaterial.uniforms.uTexel.value.set(1 / w, 1 / h);
    postMaterial.uniforms.uMaxBlur.value = 7 * targetScale;
  }
  function draw() {
    if (!state.real || !target) { renderer.setRenderTarget(null); renderer.render(scene, camera); return; }
    postMaterial.uniforms.uFocus.value = Math.max(50, camera.position.distanceTo(orbit.target) - 18);  // 顔の少し手前にピント
    renderer.setRenderTarget(target);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCamera);
  }

  let studioMap = null;
  function setLook(real, save) {
    state.real = real;
    if (real && !studioMap) studioMap = buildStudio();
    renderer.toneMapping = real ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
    renderer.toneMappingExposure = real ? 1.0 : 1.0;
    scene.environment = real ? studioMap : null;
    hemi.intensity = real ? 0.0 : 0.85;
    sun.intensity = real ? 1.25 : 0.75;
    sun.shadow.radius = real ? 7 : 1;
    rim.intensity = real ? 0.7 : 0;
    floor.material.opacity = real ? 0.42 : 0.22;
    grid.visible = !real;
    items.forEach((item) => {
      paint(item);
      const material = item.material, part = DATA.parts[item.inst.part], finish = part.finish;
      item.mesh.geometry = real ? smoothGeometry(item.inst.part) : geometries[item.inst.part];
      material.flatShading = !real;
      material.metalness = real ? 0 : (finish === "glass" ? 0.35 : 0.05);
      if (finish === "glass") {
        material.roughness = real ? 0.05 : 0.12; material.clearcoat = real ? 1 : 0; material.clearcoatRoughness = 0.03; material.envMapIntensity = real ? 1.15 : 0;
      } else if (part.printable) {  // 3D プリントの樹脂: 半艶 + 薄い艶の層 + 積層の筋
        material.roughness = real ? 0.34 : 0.62; material.clearcoat = real ? 0.45 : 0; material.clearcoatRoughness = 0.22; material.envMapIntensity = real ? 0.42 : 0;
      } else {  // スタックチャン本体: 射出成形の梨地
        material.roughness = real ? 0.5 : 0.62; material.clearcoat = 0; material.envMapIntensity = real ? 0.36 : 0;
      }
      if (finish === "glow") material.emissiveIntensity = real ? 1.5 : 0.85;
      material.userData.layerAmp.value = real && part.printable ? 0.3 : 0;
      material.needsUpdate = true;
    });
    $("look-plain").setAttribute("aria-pressed", String(!real));
    $("look-real").setAttribute("aria-pressed", String(real));
    syncPathVisibility();
    resize(); placeCamera();
    if (save) { try { localStorage.setItem("strider-look", real ? "real" : "plain"); } catch (error) { /* 保存できなくても表示は続ける */ } }
  }
  $("look-plain").addEventListener("click", () => setLook(false, true));
  $("look-real").addEventListener("click", () => setLook(true, true));
  let startReal = location.hash === "#real";
  if (!location.hash) { try { startReal = localStorage.getItem("strider-look") === "real"; } catch (error) { /* 既定の図面風で始める */ } }
  setLook(startReal, false);

  let previous = performance.now();
  function tick(now) {
    const dt = Math.min(0.1, (now - previous) / 1000);
    previous = now;
    if (state.playing) {
      state.frame += state.direction * state.rpm / 60 * F * dt;
      while (state.frame >= F) { state.frame -= F; state.lap += 1; }
      while (state.frame < 0) { state.frame += F; state.lap -= 1; }
    }
    pose();
    draw();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
